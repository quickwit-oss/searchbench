[package]
name = "loki-parquet-ingest"
version = "0.1.0"
edition = "2021"
description = "Bounded Parquet -> Loki Snappy/protobuf push client for SearchBench"

[dependencies]
anyhow = "1"
arrow-array = "58"
arrow-cast = "58"
arrow-json = "58"
arrow-schema = "58"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
parquet = { version = "58", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
snap = "1"
ureq = { version = "2", default-features = false }

[profile.release]
codegen-units = 4
lto = "thin"
